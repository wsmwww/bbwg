[build]
# 不设置base，和页面配置保持一致
publish = "vue-app/dist"
functions = "netlify/functions"
command = "cd vue-app && npm install && npx webpack --mode production"

[[redirects]]
from = "/ranking-api/*"
to = "/.netlify/functions/ranking-api/:splat"
status = 200
force = true

[[redirects]]
from = "/auth-api/*"
to = "/.netlify/functions/auth-api/:splat"
status = 200
force = true

[[redirects]]
from = "/legacy-ranking-api/*"
to = "https://benbenkshen.cn/data/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
force = true